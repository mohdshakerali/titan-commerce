# Application
spring.application.name=titan-backend

# Actuator
management.endpoints.web.exposure.include=health

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/titan_commerce
spring.datasource.username=titan_user
spring.datasource.password=titan_local_dev_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true