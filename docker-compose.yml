services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: titan_commerce
      POSTGRES_USER: titan_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/titan_commerce
      SPRING_DATASOURCE_USERNAME: titan_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TITAN_JWT_SECRET: ${TITAN_JWT_SECRET:?Set TITAN_JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - frontend
      - backend_db

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - frontend

volumes:
  postgres_data:
    external: true
    name: titan-postgres-data

networks:
  frontend:
    driver: bridge

  backend_db:
    driver: bridge
    internal: true